name: Format xivanalysis runner

on:
  push:
    branches:
      - feature/xivanalysis-v2-adapter

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format xivanalysis runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xivanalysis-v2-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write analysis-runner/runner.cjs server/xivanalysis/runner.ts server/xivanalysis/v2-adapter.ts server/service.ts server/app.ts tests/client.test.ts README.md package.json
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-runner/runner.cjs server/xivanalysis/runner.ts server/xivanalysis/v2-adapter.ts server/service.ts server/app.ts tests/client.test.ts README.md package.json
          git commit -m "Format xivanalysis runner"
          git push origin HEAD:feature/xivanalysis-v2-adapter
