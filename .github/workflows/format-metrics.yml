name: Format metric branch

on:
  push:
    branches:
      - feature/player-pull-performance

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format FFLogs metric changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-pull-performance
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write server/fflogs/client.ts shared/analysis.ts tests/analysis.test.ts tests/client.test.ts src/App.tsx
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/fflogs/client.ts shared/analysis.ts tests/analysis.test.ts tests/client.test.ts src/App.tsx
          git commit -m "Format FFLogs metric changes"
          git push origin HEAD:feature/player-pull-performance
