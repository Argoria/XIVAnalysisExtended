name: Format structured analysis once

on:
  push:
    branches:
      - feature/xivanalysis-v2-adapter

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format structured xivanalysis changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xivanalysis-v2-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write analysis-runner/runner.cjs shared/types.ts src/api.ts src/App.tsx src/components/PullDetail.tsx
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-runner/runner.cjs shared/types.ts src/api.ts src/App.tsx src/components/PullDetail.tsx
          git commit -m "Format structured xivanalysis changes"
          git push origin HEAD:feature/xivanalysis-v2-adapter
